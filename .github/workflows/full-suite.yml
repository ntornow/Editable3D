name: Editable3D full suite
# Every regression suite, including the slow exact-arithmetic suites the per-push gate skips.
# Six duration-balanced shards; private-repo runners have 2 cores, so each shard uses 2 processes.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
concurrency:
  group: editable3d-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned tools
        run: python3 tools/bootstrap.py
      - name: Headless regression suite, shard ${{ matrix.shard }} of 6
        run: python3 tools/run_headless.py --tier all --shard ${{ matrix.shard }}/6 --jobs 2
        env:
          PYTHONUNBUFFERED: '1'
      - name: Shard reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editable3d-full-shard-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            .validation/headless*.json
            .validation/headless*.log
