name: Editable3D
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editable3d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Fast tier: every suite except baseline slowSuites. full-suite.yml runs all of them.
      - name: Types, headless regression suite (fast tier), coverage, performance and portable builds
        run: python3 tools/validate.py --bootstrap --jobs 2 --tier fast
        env:
          PYTHONUNBUFFERED: '1'
      - name: Validation reports and portable packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editable3d-validation
          include-hidden-files: true
          path: |
            .validation/*.json
            .validation/*.log
            .validation/coverage/lcov.info
            dist/
